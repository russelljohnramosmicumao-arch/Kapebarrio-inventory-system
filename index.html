<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kape' Bar-Rio Inventory</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sync.css">
<style>.top-actions .icon-button{width:44px;height:44px;padding:10px;display:inline-flex;align-items:center;justify-content:center}.icon-button svg{width:23px;height:23px}.icon-button[hidden]{display:none}.top-actions .icon-button.connected{background:#15803d;color:white;border-color:#15803d}.top-actions .icon-button.update-ready{background:#d97706;color:white;border-color:#d97706}.icon-button:focus-visible{outline:3px solid #eab308;outline-offset:3px}</style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Kape' Bar-Rio</h1>
      <p>Inventory Management</p>
    </div>
    <div class="top-actions">
      <button class="top-history-btn icon-button" id="onlineStatus" type="button" aria-label="Sync inventory" title="Sync inventory"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h11a4 4 0 0 0 .5-8A6.5 6.5 0 0 0 6 8a5 5 0 0 0 1 10Z"/></svg></button>
      <button class="top-history-btn icon-button" id="previousInventoryBtn" type="button" aria-label="Previous inventory" title="Previous inventory"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg></button>
      <button class="top-history-btn icon-button" id="updateBtn" type="button" aria-label="Check for updates" title="Check for updates"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 2M4 16l2 2a7 7 0 0 0 12-1"/></svg></button>
      <button class="top-history-btn icon-button" id="backupBtn" type="button" aria-label="Download backup" title="Download backup"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
      <button class="top-history-btn icon-button" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <button id="cloudRetryBtn" hidden type="button" aria-label="Retry sync" title="Retry sync" class="top-history-btn icon-button">↻</button>
    </div>
  </header>

  <p id="cloudNote" role="status" style="padding:0 24px"></p><main class="app" id="appShell">
    <section class="panel ingredients-panel">
      <div class="tabs">
        <button class="tab active" id="inventoryTab" type="button">All Ingredients</button>
        <button class="tab" id="lowStocksTab" type="button">Low Stocks</button>
      </div>

      <div id="inventoryBrowser" class="inventory-browser">
        <aside class="category-pane" id="categoryPane"></aside>
        <div id="categoryList" class="category-list"></div>
      </div>
    </section>

    <section class="panel keypad-panel" id="keypadPanel">
      <div id="selectedEmpty" class="empty-state">
        <div class="empty-icon">☕</div>
        <h2>Select an ingredient</h2>
        <p>Choose an item on the left to enter its remaining stock.</p>
      </div>

      <div id="editor" class="editor hidden">
        <div class="keypad-item-name" id="keypadItemName"></div>
        <div class="measure-inputs" id="measureInputs"></div>
        <div class="measure-total" id="measureTotal"></div>
        <div class="measure-hint" id="measureHint"></div>
        <div class="keypad-display" id="keypadDisplay">0</div>
        <div class="keypad" id="keypad">
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" class="out-stock-key" data-key="outOfStock">Out of Stock</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="backspace">⌫</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="app.js"></script><script src="sync-config.js"></script><script src="sync-core.js"></script><script src="inventory-cloud.js"></script><script src="inventory-update.js"></script>
</body>
</html>
