<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kape' Bar-Rio Inventory</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Kape' Bar-Rio</h1>
      <p>Inventory Management</p>
    </div>
    <div class="status-pill" id="onlineStatus">Offline-ready</div>
  </header>

  <main class="app">
    <section class="panel ingredients-panel">
      <div class="panel-head">
        <div>
          <h2>Inventory</h2>
          <span id="lowCount">0 low stock</span>
        </div>
        <button class="secondary-btn" id="resetBtn" type="button">Reset Data</button>
      </div>

      <div class="tabs">
        <button class="tab active" id="inventoryTab" type="button">All Ingredients</button>
        <button class="tab" id="lowStocksTab" type="button">Low Stocks</button>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search ingredient..." autocomplete="off">
      </div>

      <div id="categoryList" class="category-list"></div>
    </section>

    <section class="panel keypad-panel">
      <div id="selectedEmpty" class="empty-state">
        <div class="empty-icon">☕</div>
        <h2>Select an ingredient</h2>
        <p>Choose an item on the left to enter its remaining stock.</p>
      </div>

      <div id="editor" class="editor hidden">
        <div class="selected-info">
          <span class="eyebrow" id="selectedCategory"></span>
          <h2 id="selectedName"></h2>
          <div class="current-stock">
            <span id="displayValue">0</span>
            <span id="displayUnit">pcs</span>
          </div>
          <span id="stockStatus" class="stock-status">Normal</span>
        </div>

        <div class="quick-adjust">
          <button type="button" data-adjust="-250">−250</button>
          <button type="button" data-adjust="-100">−100</button>
          <button type="button" data-adjust="-50">−50</button>
          <button type="button" data-adjust="50">+50</button>
          <button type="button" data-adjust="100">+100</button>
          <button type="button" data-adjust="250">+250</button>
        </div>

        <div class="keypad-display" id="keypadDisplay">0</div>
        <div class="keypad" id="keypad">
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="clear">C</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="backspace">⌫</button>
        </div>
        <button class="save-btn" id="saveBtn" type="button">SAVE STOCK</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
